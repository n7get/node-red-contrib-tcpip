<script type="text/javascript">
  RED.nodes.registerType("tcp-connect", {
    category: "tcpip",
    color: "#4A90D9",
    defaults: {
      name: { value: "" },
      host: { value: "", required: false },
      port: { value: "", validate: function (v) { return v === "" || !isNaN(parseInt(v, 10)); } },
      mode: { value: "binary" },
      waitFor: { value: "" },
      timeout: { value: 0, validate: RED.validators.number() },
      autoConnect: { value: false }
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ["events", "data"],
    icon: "font-awesome/fa-plug",
    label: function () {
      return this.name || (this.host ? "tcp " + this.host + ":" + this.port : "tcp connect");
    },
    paletteLabel: "tcp connect"
  });
</script>

<script type="text/html" data-template-name="tcp-connect">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-host"><i class="fa fa-server"></i> Host</label>
    <input type="text" id="node-input-host" placeholder="remote host (IPv4) — overridable via msg.host" />
  </div>
  <div class="form-row">
    <label for="node-input-port"><i class="fa fa-hashtag"></i> Port</label>
    <input type="text" id="node-input-port" placeholder="remote port — overridable via msg.port" />
  </div>
  <div class="form-row">
    <label for="node-input-mode"><i class="fa fa-exchange"></i> Mode</label>
    <select id="node-input-mode">
      <option value="binary">Binary (Buffer)</option>
      <option value="line">Line (String, split on CR/LF)</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-waitFor"><i class="fa fa-filter"></i> Wait For</label>
    <input type="text" id="node-input-waitFor" placeholder="optional RegExp (line mode) e.g. ^OK$" />
  </div>
  <div class="form-row">
    <label for="node-input-timeout"><i class="fa fa-clock-o"></i> Timeout</label>
    <input type="text" id="node-input-timeout" placeholder="inactivity timeout in ms (0 = none)" />
  </div>
  <div class="form-row">
    <label for="node-input-autoConnect" style="width:auto"><i class="fa fa-bolt"></i> Auto-connect on deploy</label>
    <input type="checkbox" id="node-input-autoConnect" style="display:inline-block; width:auto; vertical-align:top;" />
  </div>
</script>

<script type="text/html" data-help-name="tcp-connect">
  <p>Opens an outbound <b>TCP/IPv4</b> connection to a remote server and allocates a
  <code>sessionId</code> used by the <b>tcp send</b> and <b>tcp disconnect</b> nodes.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt class="optional">host <span class="property-type">string</span></dt>
    <dd>Overrides the configured host.</dd>
    <dt class="optional">port <span class="property-type">number</span></dt>
    <dd>Overrides the configured port.</dd>
    <dt class="optional">sessionId <span class="property-type">string</span></dt>
    <dd>Force a specific sessionId instead of an auto-generated one.</dd>
  </dl>

  <h3>Outputs</h3>
  <ol class="node-ports">
    <li>Events — lifecycle envelopes: <code>connecting</code>, <code>connected</code>,
      <code>disconnected</code>, <code>timeout</code> and <code>error</code>.</li>
    <li>Data — inbound data envelopes (<code>event:"data"</code>). Payload is a
      <code>Buffer</code> in binary mode or a <code>String</code> in line mode.</li>
  </ol>

  <h3>Details</h3>
  <p>Every output message carries <code>timestamp</code> and <code>status</code>. Error
  messages additionally carry <code>errorCode</code> and <code>errorText</code>.
  In <i>line</i> mode the stream is split on <code>\r\n</code>, <code>\n</code> or
  <code>\r</code>; an optional <b>Wait For</b> RegExp buffers lines until a match.</p>
</script>
